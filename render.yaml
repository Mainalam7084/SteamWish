services:
  - type: web
    name: steamwish
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # ── App ──────────────────────────────────────────────────────────────────
      - key: APP_NAME
        value: SteamWish
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true   # Render auto-generates a secure key on first deploy

      # ── Database (auto-wired from the PostgreSQL service below) ───────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: steamwish-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: steamwish-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: steamwish-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: steamwish-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: steamwish-db
          property: password

      # ── Session & Cache ───────────────────────────────────────────────────────
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database

      # ── Logging ───────────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── API Keys (set manually in Render dashboard after deploy) ─────────────
      # API_KEY: your Steam API key
      # ITAD_API_KEY: your ITAD API key

databases:
  - name: steamwish-db
    plan: free
    databaseName: steamwish
    user: steamwish
